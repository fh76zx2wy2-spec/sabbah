   ========================================================================= */

// ---------- سلّم الطحن الموحّد (يُستخدم لإزاحة درجة الطحن حسب التحميص) ----------
const GRIND_SCALE = [
  'ناعم جدًا (كطحن الإسبريسو)',
  'ناعم (كالسكر الناعم)',
  'متوسط إلى ناعم',
  'متوسط (كملح الطعام الخشن)',
  'متوسط إلى خشن',
  'خشن (كملح البحر الخشن)',
  'خشن جدًا (كالفلفل المطحون خشنًا)'
];

// ---------- جدول التحميص العام ----------
// المصدر: هذا هو المنطق المتّبع لدى أغلب المحمصات المختصة ومدارس مثل
// Barista Hustle — كلما فتح التحميص زادت كثافته فيحتاج حرارة أعلى وطحنًا أنعم
// وزمنًا أطول قليلًا لتعويض صعوبة الاستخلاص، والعكس مع التحميص الداكن الذي
// يستخلص بسرعة أكبر فيحتاج حرارة أخفض وطحنًا أخشن وزمنًا أقصر لتفادي المرارة.
const ROAST = {
  light:  { label: 'فاتح',   tempHot: [95, 96], grindShift: -1, timeShift:  0.10 },
  medium: { label: 'متوسط',  tempHot: [93, 94], grindShift:  0, timeShift:  0    },
  dark:   { label: 'داكن',   tempHot: [90, 92], grindShift: +1, timeShift: -0.10 },
};

function clampGrind(i){ return Math.max(0, Math.min(GRIND_SCALE.length - 1, i)); }
function fmtNum(n){ return Math.round(n).toString(); }
function fmtDuration(sec){
  sec = Math.round(sec);
  if (sec < 3600) {
    const m = Math.floor(sec/60), s = sec%60;
    return (s===0) ? `${m} د` : `${m}:${s.toString().padStart(2,'0')} د`;
  }
  const h = sec/3600;
  const hRound = Math.round(h*2)/2;
  return (hRound % 1 === 0) ? `${hRound} ساعة` : `${hRound} ساعة`;
}

function buildPours(totalWater, bloomWater, percents){
  let prev = bloomWater, out = [];
  percents.forEach((p,i)=>{
    const target = Math.round(totalWater*p);
    out.push({ n: i+1, target, amount: target - prev });
    prev = target;
  });
  return out;
}

/* =========================================================================
   حساب الوصفة
   ========================================================================= */
function computeRecipe(tool, modeKey, people, roastKey){
  const m = tool.modes[modeKey];
  const roast = ROAST[roastKey];

  const coffee = Math.round(m.coffeePerPerson * people);
  const water = Math.round(coffee * m.ratio);
  const ice = m.icePerWater ? Math.round(water * m.icePerWater) : 0;

  const grindIndex = clampGrind(m.grindBase + roast.grindShift);
  const grind = GRIND_SCALE[grindIndex];

  const temp = (modeKey === 'hot') ? `${roast.tempHot[0]}–${roast.tempHot[1]}°م` : 'ساخن قبل الصب مباشرة (95–96°م تقريبًا)';

  const totalTimeSec = m.totalTimeBase * (1 + roast.timeShift);
  const totalTime = fmtDuration(totalTimeSec);

  let bloom = null;
  if (m.bloom) {
    const bWater = Math.round(coffee * m.bloom.mult);
    const bTime = Math.round(m.bloom.timeBase * (1 + roast.timeShift));
    bloom = { water: bWater, time: `${bTime} ثانية` };
  }

  let pours = null;
  if (m.pourPercents) {
    pours = buildPours(water, bloom ? bloom.water : 0, m.pourPercents);
  }

  const steepTimeSec = (!m.pourPercents) ? m.totalTimeBase * (1 + roast.timeShift) : null;
  const steepTime = steepTimeSec ? fmtDuration(steepTimeSec) : null;

  const r = {
    coffee, water, ice,
    ratioLabel: `1 : ${m.ratio}`,
    grind, grindIndex,
    temp: (modeKey==='hot') ? `${roast.tempHot[0]}–${roast.tempHot[1]}°م` : 'ماء بارد / بحرارة الغرفة',
    hotPourTemp: `${roast.tempHot[0]}–${roast.tempHot[1]}°م`,
    totalTime,
    bloom: bloom ? { water: bloom.water, time: bloom.time } : null,
    bloomTime: bloom ? bloom.time : null,
    pours,
    steepTime,
    people, roastLabel: roast.label, modeKey,
  };
  r.steps = m.steps(r);
  return r;
}

/* =========================================================================
   الحالة والتوجيه (Routing)
   ========================================================================= */
const state = {
  theme: (window.matchMedia && window.matchMedia('prefers-color-scheme: dark').matches) ? 'dark' : 'light',
  tool: null, mode: null, people: 2, roast: 'medium', calculated: false,
};

function applyTheme(){
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
}
function toggleTheme(){ state.theme = state.theme === 'dark' ? 'light' : 'dark'; applyTheme(); renderThemeBtn(); }

// التنقل هنا يتم بالكامل داخل الذاكرة (بدون تغيير عنوان الصفحة أو استخدام
// روابط href)، لأن التنقل عبر location.hash داخل إطار الأداة (iframe) قد
// يُفسَّر كطلب تصفّح خارجي فينقل المستخدم خارج المعاينة.
let currentRoute = { name: 'home' };

function navigate(route){
  currentRoute = route;
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

window.addEventListener('DOMContentLoaded', () => {
  applyTheme();
  render();
  document.getElementById('app').addEventListener('click', (e) => {
    const el = e.target.closest('[data-nav]');
    if (!el) return;
    e.preventDefault();
    if (el.dataset.nav === 'home') navigate({ name: 'home' });
    else if (el.dataset.nav === 'tool') navigate({ name: 'tool', id: el.dataset.id });
  });
});

function render(){
  const app = document.getElementById('app');
  if (currentRoute.name === 'tool') {
    const tool = TOOLS.find(t => t.id === currentRoute.id);
    if (!tool) { app.innerHTML = notFoundView(); return; }
    state.tool = tool;
    state.mode = tool.modes.hot ? 'hot' : 'cold';
    state.people = 2; state.roast = 'medium'; state.calculated = false;
    app.innerHTML = toolView(tool);
    bindToolEvents(tool);
  } else {
    app.innerHTML = homeView();
  }
}

function bindToolEvents(t){
  document.getElementById('themeBtn').onclick = toggleTheme;

  // mode buttons
  const modeBtns = document.querySelectorAll('.mode-btn');
  function paintModeBtns(){
    modeBtns.forEach(b=>{
      const m = b.dataset.mode;
      const active = state.mode === m;
      b.textContent = m === 'hot' ? '☕ ساخن' : '🧊 بارد';
      b.className = 'mode-btn chip flex-1 rounded-2xl border-2 py-3.5 text-sm font-medium ' +
        (active ? 'border-hot bg-hot/10 text-hot' : 'border-line dark:border-lineDark text-muted dark:text-mutedDark hover:border-hot/40');
    });
  }
  modeBtns.forEach(b=> b.onclick = () => { state.mode = b.dataset.mode; paintModeBtns(); maybeRecalc(t); });
  paintModeBtns();

  // عدد الأشخاص: أزرار +/- بالإضافة إلى شرائح اختيار سريع من 1 إلى 10.
  // رُتّبت الشرائح في DOM من 1 إلى 10، وبما أن الصفحة RTL بالكامل فإن
  // العنصر الأول (1) يظهر تلقائيًا من جهة اليمين (بداية القراءة) والعدد
  // يتزايد باتجاه اليسار — أي بالاتجاه الصحيح المطلوب دون أي تحايل إضافي.
  const peopleNumEl = document.getElementById('peopleNum');
  const peopleWordEl = document.getElementById('peopleWord');
  const peopleMinusBtn = document.getElementById('peopleMinus');
  const peoplePlusBtn = document.getElementById('peoplePlus');
  const peopleChipBtns = document.querySelectorAll('.people-chip');

  function peopleWord(n){
    if (n === 1) return 'شخص واحد';
    if (n === 2) return 'شخصان';
    return `${n} أشخاص`;
  }
  function paintPeople(){
    peopleNumEl.textContent = state.people;
    peopleWordEl.textContent = peopleWord(state.people);
    peopleMinusBtn.disabled = state.people <= 1;
    peoplePlusBtn.disabled = state.people >= 10;
    peopleChipBtns.forEach(b=>{
      const active = parseInt(b.dataset.people) === state.people;
      b.className = 'people-chip shrink-0 w-10 h-10 rounded-full border-2 text-sm num font-medium flex items-center justify-center transition-colors ' +
        (active ? 'border-hot bg-hot text-white' : 'border-line dark:border-lineDark hover:border-hot');
    });
  }
  function setPeople(n){ state.people = Math.max(1, Math.min(10, n)); paintPeople(); maybeRecalc(t); }
  peopleMinusBtn.onclick = () => setPeople(state.people - 1);
  peoplePlusBtn.onclick = () => setPeople(state.people + 1);
  peopleChipBtns.forEach(b => b.onclick = () => setPeople(parseInt(b.dataset.people)));
  paintPeople();

  // roast buttons
  const roastBtns = document.querySelectorAll('.roast-btn');
  function paintRoastBtns(){
    roastBtns.forEach(b=>{
      const active = state.roast === b.dataset.roast;
      b.className = 'roast-btn chip rounded-2xl border-2 py-4 flex flex-col items-center gap-2 ' +
        (active ? 'border-hot bg-hot/10' : 'border-line dark:border-lineDark hover:border-hot/40');
    });
  }
  roastBtns.forEach(b=> b.onclick = () => { state.roast = b.dataset.roast; paintRoastBtns(); maybeRecalc(t); });
  paintRoastBtns();

  document.getElementById('calcBtn').onclick = () => { state.calculated = true; renderResult(t); document.getElementById('resultZone').scrollIntoView({behavior:'smooth', block:'start'}); };
}

function maybeRecalc(t){ if (state.calculated) renderResult(t); }

              <div class="flex items-center justify-between text-sm rounded-xl px-4 py-2.5 bg-hotSoft/60 dark:bg-hotSoftDark">
                <span>الصبة <span class="num">${p.n}</span></span>
                <span class="text-muted dark:text-mutedDark">أضف حتى <span class="num font-semibold text-ink dark:text-cream">${p.target}</span> جم <span class="text-xs">(+<span class="num">${p.amount}</span>)</span></span>
              </div>`).join('')}
          </div>
        </div>`}

        <div>
          <p class="text-xs font-medium text-muted dark:text-mutedDark mb-3">خطوات التحضير</p>
          <ol class="space-y-3">
            ${r.steps.map((s,i)=>`
              <li class="flex gap-3 text-sm leading-7">
                <span class="shrink-0 w-6 h-6 rounded-full bg-hot text-white text-xs flex items-center justify-center num mt-0.5">${i+1}</span>
                <span>${s}</span>
              </li>`).join('')}
          </ol>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-line dark:border-lineDark text-sm">
          <span class="text-muted dark:text-mutedDark">الزمن الإجمالي للتحضير</span>
          <span class="font-semibold num">${isImmersion ? r.steepTime : r.totalTime}</span>
        </div>

      </div>
    </div>
  `;
}
</script>
</body>
</html>
